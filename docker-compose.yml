version: "3.8"

services:
  stats-compass:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Server config
      - STATS_COMPASS_HOST=0.0.0.0
      - STATS_COMPASS_PORT=8000
      - STATS_COMPASS_MEMORY_LIMIT_MB=500
      - STATS_COMPASS_SESSION_TTL_HOURS=24
      - STATS_COMPASS_MAX_SESSIONS=100

      # Storage config (local for dev, S3 for prod)
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_PATH=/tmp/stats-compass-uploads
      # Uncomment for S3 storage:
      # - STORAGE_BACKEND=s3
      # - S3_BUCKET=your-bucket-name
      # - S3_PREFIX=uploads
      # - S3_REGION=us-east-1
      # - AWS_ACCESS_KEY_ID=your-access-key
      # - AWS_SECRET_ACCESS_KEY=your-secret-key

    volumes:
      # Persist uploads between restarts (local dev only)
      - uploads:/tmp/stats-compass-uploads

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/mcp", "-H", "Accept: text/event-stream" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped

volumes:
  uploads:
