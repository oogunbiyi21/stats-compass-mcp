# The full test suite, on every pull request and every push to main.
#
# "tests" is the check to make required on main: a pull request that fails it
# cannot merge, and release.yml publishes only a commit this workflow passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install the package and the dev tools
        run: poetry install --with dev --no-interaction

      - name: Run the test suite
        run: poetry run pytest -q -p no:cacheprovider

  site-css:
    # The site's compiled Tailwind (css/tailwind.css) has every class its pages use:
    # rebuilt here, it must match the committed file. Run scripts/build-css.sh if not.
    name: site css
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild the site's CSS
        run: scripts/build-css.sh

      - name: The committed CSS is up to date
        run: git diff --exit-code css/tailwind.css
