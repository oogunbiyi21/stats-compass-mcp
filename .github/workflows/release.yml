# Publish to PyPI and the MCP Registry when main carries a new version.
#
# Runs only after CI has passed on a push to main, and builds that exact commit
# (the CI run's head_sha), so nothing ships that the tests did not pass.
# Merging a pull request that bumps the version in pyproject.toml is the
# release go; a push that keeps the version does nothing here.
#
# PyPI publishing uses trusted publishing (OIDC): PyPI trusts this workflow
# file, in this repository, in the "pypi" environment, with no token secret.
# The registry step logs in with GitHub OIDC too. See docs/release-process.md.
#
# Recovery: run this workflow by hand with registry_only_version to republish
# a version PyPI already has to the MCP Registry (PyPI is skipped).
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      registry_only_version:
        description: >-
          Publish an already-released version to the MCP Registry only
          (e.g. 0.3.33). Skips PyPI. Use to recover when the registry step
          failed but PyPI succeeded, or the listing fell behind.
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE: stats-compass-mcp

jobs:
  build:
    name: build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.pypi.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the version
        id: version
        run: |
          version="$(python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print(d.get('project', {}).get('version') or d['tool']['poetry']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml declares $PACKAGE $version"

      - name: Is it already on PyPI?
        id: pypi
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/${{ steps.version.outputs.version }}/json")"
          case "$status" in
            200) echo "release=false" >> "$GITHUB_OUTPUT"; echo "Already on PyPI: nothing to release." ;;
            404) echo "release=true" >> "$GITHUB_OUTPUT"; echo "Not on PyPI yet: releasing." ;;
            *) echo "::error::PyPI answered $status; not guessing whether to release."; exit 1 ;;
          esac

      - name: Build
        if: steps.pypi.outputs.release == 'true'
        run: |
          pip install poetry
          poetry build

      - uses: actions/upload-artifact@v4
        if: steps.pypi.outputs.release == 'true'
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stats-compass-mcp/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    name: tag
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tag the released commit
        run: |
          tag="v${{ needs.build.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; leaving it."
            exit 0
          fi
          git tag "$tag" "${{ github.event.workflow_run.head_sha }}"
          git push origin "$tag"

  registry:
    name: registry
    needs: [build, publish]
    # After a release, or by hand for a version PyPI already has.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the version
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.registry_only_version }}"
            echo "Registry-only publish of $version (PyPI is skipped)"
          else
            version="${{ needs.build.outputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The registry checks the package exists on PyPI, and a fresh upload can
      # take a moment to appear.
      - name: Wait for the version on PyPI
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$PACKAGE/${{ steps.release.outputs.version }}/json")"
            [ "$status" = "200" ] && exit 0
            echo "PyPI answered $status; waiting ($attempt/30)"
            sleep 10
          done
          echo "::error::$PACKAGE ${{ steps.release.outputs.version }} is not on PyPI."
          exit 1

      # server.json's version is derived from the release, never edited by
      # hand: a hand-kept copy drifted to 0.3.0 while PyPI reached 0.3.28, and
      # the registry rejected every publish as a duplicate.
      - name: Sync server.json to the release version
        run: |
          set -euo pipefail
          jq --arg v "${{ steps.release.outputs.version }}" \
            '.version = $v | .packages |= map(.version = $v)' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
